[project]
name = "esgx-engine"
version = "0.4.0"
description = "ESG Exposure & Analysis Engine consolidated into Green Street"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "duckdb>=1.0",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "lxml>=5",
    "tqdm>=4.66",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pypdf>=4",
    "tabulate>=0.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
llm = ["anthropic>=0.60"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine", "engine/greenwash"]
