[project]
name = "esgx"
version = "0.1.0"
description = "ESG Exposure Engine: measure firm ESG/climate exposure, simulate regulatory diffusion, invest on it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "duckdb>=1.0",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "lxml>=5",
    "tqdm>=4.66",
    "anthropic>=0.60",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pypdf>=4",
    "tabulate>=0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "jupyter>=1.0", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esgx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
